<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>AnimeUnity Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: auto; user-select: auto; }
  :root {
    --bg: #ececee; --field: #ffffff; --sep: rgba(0,0,0,.14); --sep2: rgba(0,0,0,.08);
    --text: #1d1d1f; --text2: #5d5d62; --text3: #66666b;
    --accent: #d3003f; --blue: #007aff;
    --track: rgba(0,0,0,.1); --seg: rgba(0,0,0,.06); --segactive: #ffffff;
    --tile-red: #fbe3e9; --tile-red-fg: #c0264f;
    --tile-green: #e2f4e6; --tile-green-fg: #1e8e3e;
    --ring: rgba(10,132,255,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20; --field: #2c2c2e; --sep: rgba(255,255,255,.14); --sep2: rgba(255,255,255,.08);
      --text: #f5f5f7; --text2: #a1a1a6; --text3: #8e8e93;
      --blue: #0a84ff;
      --track: #3a3a3c; --seg: rgba(255,255,255,.08); --segactive: #4a4a4e;
      --tile-red: #3a2024; --tile-red-fg: #f09595;
      --tile-green: #1d2b20; --tile-green-fg: #30d158;
      --ring: rgba(10,132,255,.35);
    }
  }
  html { background: transparent; }
  body { background: var(--bg); color: var(--text);
    font-family: "SF Pro Text", "SF Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 13px; letter-spacing: -0.08px; }
  body.native { background: rgba(242,242,244,.72); }
  @media (prefers-color-scheme: dark) { body.native { background: rgba(30,30,32,.65); } }

  #titlebar { height: 52px; display: flex; align-items: center; justify-content: center; }
  body.browser #titlebar { height: 46px; }

  .seg { position: relative; display: inline-flex; background: var(--seg);
    border-radius: 8px; padding: 2px; }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: 0;
    border-radius: 6px; background: var(--segactive);
    box-shadow: 0 0 1px rgba(0,0,0,.25), 0 1px 2.5px rgba(0,0,0,.18);
    transition: left .24s cubic-bezier(.3,.8,.3,1), width .24s cubic-bezier(.3,.8,.3,1); }
  .seg button { position: relative; z-index: 1; border: none; background: transparent;
    padding: 4px 16px; font-family: inherit; font-size: 12.5px; border-radius: 6px;
    color: var(--text2); cursor: default; transition: color .18s; }
  .seg button.active { color: var(--text); font-weight: 500; }
  .seg button:active:not(.active) { color: var(--text3); }

  main { max-width: 620px; margin: 0 auto; padding: 6px 26px 26px; }

  .field { display: flex; align-items: center; background: var(--field);
    border: 0.5px solid var(--sep); border-radius: 9px; height: 40px; padding: 0 12px;
    transition: border-color .18s, box-shadow .18s; }
  .field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--ring); }
  .field input { flex: 1; border: none; background: transparent; outline: none;
    font-size: 13.5px; color: var(--text); font-family: inherit; }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .xrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    overflow: hidden; max-height: 0; opacity: 0; margin-top: 0;
    transition: max-height .28s cubic-bezier(.3,.8,.3,1), opacity .22s, margin-top .28s; }
  .xrow.open { max-height: 44px; opacity: 1; margin-top: 12px; }

  .btn { border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px;
    font-weight: 600; font-family: inherit; background: var(--accent); color: #fff;
    cursor: default; transition: transform .12s ease, filter .15s, opacity .2s; }
  .btn:hover:not(:disabled) { filter: brightness(1.07); }
  .btn:active:not(:disabled) { transform: scale(.965); filter: brightness(.82); }
  .btn:disabled { opacity: .4; }

  .link { background: none; border: none; color: var(--blue); font-size: 12.5px;
    font-family: inherit; padding: 0; cursor: default; transition: opacity .12s; }
  .link:hover { opacity: .65; }
  .link:active { opacity: .4; }

  .mini { width: 70px; height: 30px; border: 0.5px solid var(--sep); border-radius: 8px;
    background: var(--field); text-align: center; font-size: 12.5px; color: var(--text);
    outline: none; font-family: inherit; transition: border-color .18s, box-shadow .18s; }
  .mini:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--ring); }

  .hint { font-size: 12.5px; color: var(--text2); }
  .hint2 { font-size: 12px; color: var(--text3); }

  textarea { width: 100%; min-height: 110px; background: var(--field);
    border: 0.5px solid var(--sep); border-radius: 9px; padding: 10px 12px;
    font-family: inherit; font-size: 13px; letter-spacing: -0.08px; line-height: 1.6;
    color: var(--text); outline: none;
    resize: vertical; transition: border-color .18s, box-shadow .18s; }
  textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--ring); }

  .dest { display: flex; align-items: center; gap: 8px; margin-top: 14px;
    font-size: 12.5px; color: var(--text2); }
  hr { border: none; border-top: 0.5px solid var(--sep2); margin: 18px -26px; }
  .compact { font-family: "SF Compact Text", "SF Compact Display", "SF Pro Text",
    -apple-system, sans-serif; letter-spacing: 0; }
  .sect { font-size: 11px; color: var(--text3); letter-spacing: .06em; margin: 0 0 4px;
    font-family: "SF Compact Text", "SF Compact Display", "SF Pro Text", -apple-system, sans-serif; }

  .dl { display: flex; align-items: center; gap: 12px; margin-top: 12px;
    animation: rowIn .3s cubic-bezier(.3,.8,.3,1); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
  .tile { width: 36px; height: 36px; border-radius: 9px; display: flex;
    align-items: center; justify-content: center; flex: none; }
  .dl .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; background: var(--track); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 2px;
    transition: width .4s; }
  .bar.indet > div { width: 40% !important; animation: indet 1.3s infinite cubic-bezier(.4,.1,.6,.9); }
  @keyframes indet { from { margin-left: -40%; } to { margin-left: 100%; } }
  .cap { font-size: 12px; color: var(--text2); margin-top: 5px;
    font-variant-numeric: tabular-nums; }

  .xbtn { width: 22px; height: 22px; border: none; border-radius: 50%; background: var(--seg);
    color: var(--text2); cursor: default; flex: none;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .12s; }
  .xbtn:hover { background: var(--track); }
  .xbtn:active { transform: scale(.9); }

  .sub { display: flex; align-items: center; gap: 10px; margin: 9px 0 0 48px; }
  .sub .bar { flex: 1; height: 3px; margin: 0; }
  .sub span { font-size: 12px; color: var(--text3); width: 104px; flex: none;
    font-family: "SF Compact Text", "SF Compact Display", "SF Pro Text", -apple-system, sans-serif;
    font-variant-numeric: tabular-nums; letter-spacing: 0; }

  .check { stroke-dasharray: 24; stroke-dashoffset: 24;
    animation: draw .45s .15s forwards cubic-bezier(.6,0,.4,1); }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  #discl { margin-top: 20px; background: none; border: none; color: var(--text3);
    font-size: 12px; font-family: inherit; display: flex; align-items: center; gap: 5px;
    cursor: default; transition: color .15s; }
  #discl:hover { color: var(--text2); }
  #discl .chev { display: inline-block; transition: transform .18s cubic-bezier(.3,.8,.3,1); font-size: 14px; }
  #discl.open .chev { transform: rotate(90deg); }
  #log { display: none; margin-top: 10px; background: var(--field);
    border: 0.5px solid var(--sep2); border-radius: 9px; padding: 10px 12px;
    font: 11.5px "SF Mono", ui-monospace, Menlo, monospace; color: var(--text2);
    max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    -webkit-user-select: text; user-select: text; }
  .empty { text-align: center; padding: 26px 0 6px; color: var(--text3); }
  .empty svg { opacity: .55; }
  .empty-title { font-family: "SF Pro Display", "SF Pro", -apple-system, sans-serif;
    font-size: 20px; font-weight: 600; letter-spacing: .1px; color: var(--text2);
    margin-top: 10px; }
  .empty-sub { font-size: 12.5px; color: var(--text3); margin-top: 3px; }

  .btn:focus-visible, .link:focus-visible, .xbtn:focus-visible,
  #discl:focus-visible, .seg button:focus-visible {
    outline: none; box-shadow: 0 0 0 3px var(--ring); }

  .enter { animation: paneIn .22s cubic-bezier(.3,.8,.3,1); }
  @keyframes paneIn { from { opacity: 0; transform: translateY(5px); } }

  /* --- Pannello opzioni "Altri siti" (fisarmonica) --- */
  #optPanel { margin-top: 6px; border-top: 0.5px solid var(--sep2); }
  .acc { border-bottom: 0.5px solid var(--sep2); }
  .acc-head { display: flex; align-items: center; gap: 7px; width: 100%;
    background: none; border: none; font-family: inherit; color: var(--text);
    font-size: 13px; padding: 11px 2px; cursor: default; text-align: left; }
  .acc-head .chev { display: inline-block; transition: transform .18s cubic-bezier(.3,.8,.3,1);
    font-size: 14px; color: var(--text3); }
  .acc.open .acc-head .chev { transform: rotate(90deg); }
  .acc-head .badge { margin-left: auto; font-size: 11.5px; color: var(--text3);
    font-variant-numeric: tabular-nums; }
  .acc-body { overflow: hidden; max-height: 0; opacity: 0;
    transition: max-height .3s cubic-bezier(.3,.8,.3,1), opacity .22s; }
  .acc.open .acc-body { max-height: 900px; opacity: 1; }
  .acc-inner { padding: 2px 2px 12px; }
  .opt-row { display: flex; align-items: center; gap: 10px; min-height: 30px; margin-top: 6px; }
  .opt-row .lbl { font-size: 13px; color: var(--text); flex: 1; }
  .opt-row.sub { margin-left: 20px; }
  .opt-row.sub .lbl { color: var(--text2); font-size: 12.5px; }
  .msel { height: 28px; background: var(--field); color: var(--text);
    border: 0.5px solid var(--sep); border-radius: 7px; padding: 0 8px;
    font-family: inherit; font-size: 12.5px; outline: none; }
  .minput { height: 28px; background: var(--field); color: var(--text);
    border: 0.5px solid var(--sep); border-radius: 7px; padding: 0 9px;
    font-family: inherit; font-size: 12.5px; outline: none; }
  .minput:focus, .msel:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--ring); }
  .tgl { width: 36px; height: 22px; border-radius: 11px; background: var(--track);
    position: relative; flex: none; cursor: default; transition: background .2s; }
  .tgl.on { background: #30d158; }
  .tgl::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: left .2s cubic-bezier(.3,.8,.3,1);
    box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .tgl.on::after { left: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 4px 11px; border-radius: 20px; cursor: default;
    background: var(--seg); color: var(--text2); border: 0.5px solid transparent; }
  .chip.on { background: var(--tile-red); color: var(--tile-red-fg);
    border-color: var(--tile-red-fg); }
  .grp-lbl { font-size: 11px; color: var(--text3); letter-spacing: .04em; margin: 4px 0; }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .check { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div id="titlebar">
  <div class="seg" id="tabSeg">
    <div class="thumb"></div>
    <button data-v="single" class="active">Singolo</button>
    <button data-v="batch">Batch</button>
    <button data-v="other" id="tabOther" class="hidden">Altri siti</button>
  </div>
</div>
<main>
  <div id="paneSingle">
    <div class="field">
      <input id="url" placeholder="Incolla il link dell'anime da AnimeUnity…" spellcheck="false">
    </div>
    <div class="row">
      <span class="hint">Episodi</span>
      <div class="seg" id="modeSeg">
        <div class="thumb"></div>
        <button data-v="all" class="active">Tutti</button>
        <button data-v="range">Intervallo</button>
        <button data-v="list">Specifici</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn" id="btnSingle" onclick="startSingle()">Scarica</button>
    </div>
    <div class="xrow" id="rangeRow">
      <span class="hint">da</span><input class="mini" id="start">
      <span class="hint">a</span><input class="mini" id="end">
      <span class="hint2">vuoto = dall'inizio / fino alla fine</span>
    </div>
    <div class="xrow" id="listRow">
      <input class="mini" id="epList" placeholder="3, 7, 12" style="width:180px; text-align:left; padding:0 10px;">
      <span class="hint2">numeri separati da virgola</span>
    </div>
  </div>

  <div id="paneBatch" class="hidden">
    <textarea id="batchUrls" placeholder="Un link per riga…" spellcheck="false"></textarea>
    <div class="row">
      <button class="link" onclick="loadUrls()">Ricarica elenco</button>
      <span class="hint2">·</span>
      <button class="link" onclick="saveUrls()">Salva elenco</button>
      <span style="flex:1"></span>
      <button class="btn" id="btnBatch" onclick="startBatch()">Scarica tutti</button>
    </div>
  </div>

  <div id="paneOther" class="hidden">
    <div class="field">
      <input id="otherUrl" placeholder="Incolla un link (YouTube, Vimeo, …)" spellcheck="false">
    </div>
    <textarea id="otherBatch" class="hidden" placeholder="Un link per riga…" spellcheck="false" style="margin-top:10px"></textarea>
    <div class="row">
      <span class="hint">Qualità</span>
      <div class="seg" id="qualitySeg">
        <div class="thumb"></div>
        <button data-v="best" class="active">Migliore</button>
        <button data-v="1080">1080p</button>
        <button data-v="720">720p</button>
        <button data-v="480">480p</button>
        <button data-v="audio">Audio</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn" id="btnOther" onclick="startOther()">Scarica</button>
    </div>
    <div class="row">
      <button class="link" onclick="showFormats()">Mostra formati disponibili</button>
      <span class="hint2">·</span>
      <button id="optToggle" class="link" onclick="toggleOpts()">Opzioni</button>
    </div>
    <div id="optPanel" class="hidden"></div>
  </div>

  <div class="dest">
    <svg width="15" height="15" viewBox="0 0 24 24" style="color:var(--blue); flex:none" fill="currentColor" aria-hidden="true"><path d="M4 4h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
    <span>Salva in&nbsp;<span id="destName" style="color:var(--text)" title="La tua cartella Scaricati">Downloads</span></span>
    <button class="link" onclick="pickFolder()">Cambia…</button>
    <span style="flex:1"></span>
    <button class="link" onclick="openDest()">Apri cartella</button>
  </div>

  <hr>
  <p class="sect">DOWNLOAD</p>

  <div id="current" class="hidden">
    <div class="dl">
      <div class="tile" style="background:var(--tile-red); color:var(--tile-red-fg)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div style="flex:1; min-width:0">
        <p class="name" id="curName"></p>
        <div class="bar" id="curTrack" role="progressbar" aria-label="Avanzamento download"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="curBar" style="width:0%"></div></div>
        <p class="cap" id="curCap"></p>
      </div>
      <button class="xbtn" onclick="cancelJob()" aria-label="Annulla download"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
    </div>
    <div id="subRows"></div>
  </div>

  <div id="doneList"></div>
  <div class="empty" id="empty">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 7.5v8M8.6 12.4l3.4 3.4 3.4-3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="empty-title">Nessun download</p>
    <p class="empty-sub" id="emptySub">Incolla o trascina qui un link di AnimeUnity</p>
  </div>

  <button id="discl" onclick="toggleLog()"><span class="chev">›</span><span id="disclLabel">Mostra dettagli</span></button>
  <pre id="log"></pre>
</main>

<script>
const $ = (id) => document.getElementById(id);
let customPath = '';
let mode = 'all';
const bridge = (window.webkit && window.webkit.messageHandlers) || {};
const native = !!bridge.pickFolder;
document.body.classList.add(native ? 'native' : 'browser');

document.getElementById('titlebar').addEventListener('mousedown', (e) => {
  if (e.target.closest('button')) return;
  if (bridge.dragWindow) bridge.dragWindow.postMessage('');
});
document.getElementById('titlebar').addEventListener('dblclick', (e) => {
  if (e.target.closest('button')) return;
  if (bridge.zoomWindow) bridge.zoomWindow.postMessage('');
});

function makeSeg(id, cb) {
  const seg = $(id);
  const thumb = seg.querySelector('.thumb');
  const btns = [...seg.querySelectorAll('button')];
  const ctl = {
    select(v, animate = true) {
      const btn = btns.find((b) => b.dataset.v === v);
      if (!btn) return;
      btns.forEach((x) => x.classList.toggle('active', x === btn));
      if (!animate) thumb.style.transition = 'none';
      thumb.style.left = btn.offsetLeft + 'px';
      thumb.style.width = btn.offsetWidth + 'px';
      if (!animate) requestAnimationFrame(() => { thumb.style.transition = ''; });
      cb(v);
    },
  };
  btns.forEach((b) => b.addEventListener('click', () => ctl.select(b.dataset.v)));
  requestAnimationFrame(() => {
    const a = btns.find((b) => b.classList.contains('active')) || btns[0];
    ctl.select(a.dataset.v, false);
  });
  return ctl;
}

const PANES = { single: 'paneSingle', batch: 'paneBatch', other: 'paneOther' };
const tabCtl = makeSeg('tabSeg', (v) => {
  const to = $(PANES[v]);
  if (!to || !to.classList.contains('hidden')) return;
  Object.values(PANES).forEach((id) => {
    if (id !== PANES[v]) $(id).classList.add('hidden');
  });
  to.classList.remove('hidden');
  to.classList.remove('enter'); void to.offsetWidth; to.classList.add('enter');
});
makeSeg('modeSeg', (v) => {
  mode = v;
  $('rangeRow').classList.toggle('open', v === 'range');
  $('listRow').classList.toggle('open', v === 'list');
});
let otherQuality = 'best';
makeSeg('qualitySeg', (v) => {
  otherQuality = v;
  if ($('optPanel').children.length) applyShowIf();
});

async function api(path, body) {
  const resp = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {}),
  });
  const data = await resp.json();
  if (data.error) alert(data.error);
  return data;
}

function startSingle() {
  api('/download', {
    url: $('url').value, mode: mode,
    start: $('start').value, end: $('end').value,
    episodes: $('epList').value, path: customPath,
  });
}
function startBatch() { api('/batch', { urls: $('batchUrls').value, path: customPath }); }

const SB_CATS = [['sponsor','Sponsor'],['selfpromo','Autopromozione'],
  ['interaction','Richieste like/iscriviti'],['intro','Introduzione'],
  ['outro','Sigla finale'],['music_offtopic','Musica non pertinente'],['preview','Riassunto/anteprima']];

const OPT = [
  {t:'Sottotitoli e metadati', f:[
    {k:'subtitles', type:'toggle', l:'Sottotitoli'},
    {k:'sub_lang', type:'text', l:'Lingue', def:'it,en', w:130, sub:1, when:s=>s.subtitles},
    {k:'sub_embed', type:'toggle', l:'Incorpora nel video', sub:1, when:s=>s.subtitles},
    {k:'thumbnail', type:'toggle', l:'Miniatura di copertina'},
    {k:'metadata', type:'toggle', l:'Metadati (titolo, autore)'},
    {k:'chapters', type:'toggle', l:'Capitoli'},
    {k:'write_description', type:'toggle', l:'Salva la descrizione'},
    {k:'write_comments', type:'toggle', l:'Salva i commenti'},
    {k:'write_info', type:'toggle', l:'Salva info tecniche (.json)'},
  ]},
  {t:'SponsorBlock', f:[
    {k:'sponsorblock', type:'seg', l:'Segmenti sponsor', def:'off',
     opts:[['off','Ignora'],['mark','Segnala'],['remove','Rimuovi']]},
    {k:'sponsorblock_cats', type:'chips', l:'Categorie', def:['sponsor','selfpromo','interaction'],
     opts:SB_CATS, when:s=>s.sponsorblock!=='off'},
  ]},
  {t:'Audio', when:()=>otherQuality==='audio', f:[
    {k:'audio_format', type:'seg', l:'Formato', def:'mp3',
     opts:[['mp3','MP3'],['m4a','M4A'],['opus','Opus'],['flac','FLAC'],['wav','WAV']]},
    {k:'audio_quality', type:'select', l:'Qualità', def:'best',
     opts:[['best','Migliore'],['320','320 kbps'],['256','256 kbps'],['192','192 kbps'],['128','128 kbps']]},
    {k:'keep_original', type:'toggle', l:'Tieni anche il video'},
  ]},
  {t:'Video e conversione', when:()=>otherQuality!=='audio', f:[
    {k:'container', type:'seg', l:'Contenitore', def:'mp4',
     opts:[['mp4','MP4'],['mkv','MKV'],['original','Originale']]},
    {k:'recode', type:'toggle', l:'Ricodifica per compatibilità'},
    {k:'recode_format', type:'select', l:'Formato', def:'mp4', sub:1, when:s=>s.recode,
     opts:[['mp4','MP4'],['webm','WebM'],['mkv','MKV']]},
    {k:'split_chapters', type:'toggle', l:'Dividi per capitoli (file separati)'},
  ]},
  {t:'Playlist e selezione', f:[
    {k:'playlist', type:'toggle', l:"Scarica l'intera playlist"},
    {k:'playlist_items', type:'text', l:'Elementi', ph:'es. 1-5', w:90, sub:1, when:s=>s.playlist},
    {k:'playlist_reverse', type:'toggle', l:'Ordine inverso', sub:1, when:s=>s.playlist},
    {k:'date_after', type:'text', l:'Solo dopo', ph:'AAAAMMGG', w:110},
    {k:'date_before', type:'text', l:'Solo prima', ph:'AAAAMMGG', w:110},
    {k:'download_archive', type:'toggle', l:'Ricorda i già scaricati (salta i doppioni)'},
  ]},
  {t:'Ritaglio e dirette', f:[
    {k:'time', type:'time', l:'Ritaglio'},
    {k:'live_from_start', type:'toggle', l:'Dirette: scarica dall\'inizio'},
  ]},
  {t:'Nomi e cartelle', f:[
    {k:'subfolder_channel', type:'toggle', l:'Sottocartella per ogni canale'},
    {k:'filename_template', type:'text', l:'Schema nome (avanzato)', ph:'%(title)s.%(ext)s', w:180},
  ]},
  {t:'Rete e robustezza', f:[
    {k:'fast', type:'toggle', l:'Download veloce (frammenti paralleli)'},
    {k:'rate_limit', type:'text', l:'Limite velocità', ph:'MB/s', w:70},
    {k:'sleep_interval', type:'text', l:'Pausa tra i download', ph:'sec', w:70},
    {k:'retries', type:'text', l:'Tentativi', ph:'10', w:70},
    {k:'proxy', type:'text', l:'Proxy', ph:'http://…', w:160},
    {k:'geo_bypass', type:'toggle', l:'Aggira blocchi geografici'},
    {k:'cookies_browser', type:'select', l:'Cookie del browser', def:'none',
     opts:[['none','Nessuno'],['safari','Safari'],['chrome','Chrome'],['firefox','Firefox'],['edge','Edge']]},
  ]},
  {t:'Protezione e più link', f:[
    {k:'video_password', type:'password', l:'Password del video', ph:'facoltativa', w:150},
    {k:'batch', type:'toggle', l:'Coda più link (uno per riga)'},
  ]},
];

const optState = {};
OPT.forEach(sec => sec.f.forEach(fl => {
  optState[fl.k] = fl.def !== undefined ? fl.def : (fl.type === 'toggle' ? false : '');
}));

function esc(s){ const d=document.createElement('span'); d.textContent=s; return d.innerHTML; }

function buildOpts() {
  const panel = $('optPanel');
  panel.innerHTML = '';
  OPT.forEach((sec, si) => {
    const acc = document.createElement('div');
    acc.className = 'acc'; acc.dataset.sec = si;
    if (sec.when) acc.dataset.secwhen = '1';
    const head = document.createElement('button');
    head.className = 'acc-head';
    head.innerHTML = '<span class="chev">›</span><span>' + esc(sec.t) +
      '</span><span class="badge"></span>';
    head.onclick = () => acc.classList.toggle('open');
    const body = document.createElement('div');
    body.className = 'acc-body';
    const inner = document.createElement('div');
    inner.className = 'acc-inner';
    sec.f.forEach(fl => inner.appendChild(buildField(fl)));
    body.appendChild(inner); acc.appendChild(head); acc.appendChild(body);
    panel.appendChild(acc);
  });
  applyShowIf();
}

function buildField(fl) {
  const row = document.createElement('div');
  row.className = 'opt-row' + (fl.sub ? ' sub' : '');
  row.dataset.k = fl.k;
  const lbl = document.createElement('span');
  lbl.className = 'lbl'; lbl.textContent = fl.l;
  const ctrl = document.createElement('span');
  ctrl.style.cssText = 'display:flex;align-items:center;gap:8px';

  if (fl.type === 'toggle') {
    const t = document.createElement('span');
    t.className = 'tgl' + (optState[fl.k] ? ' on' : '');
    t.onclick = () => { optState[fl.k] = !optState[fl.k];
      t.classList.toggle('on', optState[fl.k]);
      if (fl.k === 'batch') applyBatch();
      applyShowIf(); };
    row.appendChild(lbl); ctrl.appendChild(t);
  } else if (fl.type === 'text' || fl.type === 'password') {
    const i = document.createElement('input');
    i.className = 'minput'; i.type = fl.type === 'password' ? 'password' : 'text';
    i.placeholder = fl.ph || ''; i.value = optState[fl.k] || '';
    if (fl.w) i.style.width = fl.w + 'px';
    i.oninput = () => { optState[fl.k] = i.value; };
    row.appendChild(lbl); ctrl.appendChild(i);
  } else if (fl.type === 'select') {
    const s = document.createElement('select'); s.className = 'msel';
    fl.opts.forEach(([v, t]) => { const o = document.createElement('option');
      o.value = v; o.textContent = t; if (v === optState[fl.k]) o.selected = true; s.appendChild(o); });
    s.onchange = () => { optState[fl.k] = s.value; };
    row.appendChild(lbl); ctrl.appendChild(s);
  } else if (fl.type === 'seg') {
    const seg = document.createElement('span');
    seg.style.cssText = 'display:inline-flex;background:var(--seg);border-radius:8px;padding:2px';
    fl.opts.forEach(([v, t]) => { const b = document.createElement('button');
      b.textContent = t; b.dataset.v = v;
      b.style.cssText = 'border:none;background:transparent;font-family:inherit;font-size:12px;padding:3px 10px;border-radius:6px;color:var(--text2);cursor:default';
      const paint = () => { const on = optState[fl.k] === v;
        b.style.background = on ? 'var(--segactive)' : 'transparent';
        b.style.color = on ? 'var(--text)' : 'var(--text2)';
        b.style.fontWeight = on ? '500' : '400'; };
      b.onclick = () => { optState[fl.k] = v;
        [...seg.children].forEach(c => c.dispatchEvent(new Event('paint')));
        applyShowIf(); };
      b.addEventListener('paint', paint); paint(); seg.appendChild(b); });
    row.appendChild(lbl); ctrl.appendChild(seg);
  } else if (fl.type === 'chips') {
    row.style.alignItems = 'flex-start';
    const wrap = document.createElement('span'); wrap.className = 'chips';
    fl.opts.forEach(([v, t]) => { const c = document.createElement('span');
      c.className = 'chip' + (optState[fl.k].includes(v) ? ' on' : '');
      c.textContent = t;
      c.onclick = () => { const arr = optState[fl.k];
        const i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1);
        c.classList.toggle('on', arr.includes(v)); };
      wrap.appendChild(c); });
    lbl.style.paddingTop = '4px'; row.appendChild(lbl); ctrl.appendChild(wrap);
  } else if (fl.type === 'time') {
    const mk = (key, ph) => { const i = document.createElement('input');
      i.className = 'minput'; i.placeholder = ph; i.style.width = '62px';
      i.value = optState[key] || ''; i.oninput = () => { optState[key] = i.value; }; return i; };
    row.appendChild(lbl);
    const da = document.createElement('span'); da.className = 'lbl'; da.style.flex = 'none'; da.textContent = 'da';
    const a = document.createElement('span'); a.className = 'lbl'; a.style.flex = 'none'; a.textContent = 'a';
    ctrl.appendChild(da); ctrl.appendChild(mk('time_from', '0:00'));
    ctrl.appendChild(a); ctrl.appendChild(mk('time_to', 'fine'));
  }
  row.appendChild(ctrl);
  return row;
}

function applyShowIf() {
  OPT.forEach((sec, si) => {
    const acc = $('optPanel').querySelector('.acc[data-sec="' + si + '"]');
    if (!acc) return;
    if (sec.when) acc.classList.toggle('hidden', !sec.when(optState));
    let active = 0;
    sec.f.forEach(fl => {
      const row = acc.querySelector('.opt-row[data-k="' + fl.k + '"]');
      if (!row) return;
      const shown = !fl.when || fl.when(optState);
      row.classList.toggle('hidden', !shown);
      if (!shown) return;  // le opzioni nascoste non contano nel badge
      const v = optState[fl.k];
      if ((fl.type === 'toggle' && v) ||
          ((fl.type === 'text' || fl.type === 'password') && v && v !== (fl.def || '')) ||
          (fl.type === 'seg' && fl.def && v !== fl.def) ||
          (fl.type === 'select' && fl.def && v !== fl.def) ||
          (fl.type === 'chips' && v.length) ||
          (fl.type === 'time' && (optState.time_from || optState.time_to))) active++;
    });
    const badge = acc.querySelector('.badge');
    if (badge) badge.textContent = active ? active + ' attive' : '';
  });
}

function applyBatch() {
  const on = optState.batch;
  $('otherUrl').classList.toggle('hidden', on);
  $('otherBatch').classList.toggle('hidden', !on);
}

function toggleOpts() {
  const p = $('optPanel');
  const open = !p.classList.contains('hidden');
  p.classList.toggle('hidden', open);
  $('optToggle').textContent = 'Opzioni';
}

function collectOptions() {
  const o = {};
  Object.keys(optState).forEach(k => {
    const v = optState[k];
    if (v !== '' && v !== false && !(Array.isArray(v) && v.length === 0)) o[k] = v;
  });
  if (Array.isArray(o.sponsorblock_cats)) o.sponsorblock_cats = o.sponsorblock_cats.join(',');
  return o;
}

function startOther() {
  const url = optState.batch ? $('otherBatch').value : $('otherUrl').value;
  api('/ytdlp', { url: url, quality: otherQuality, options: collectOptions(), path: customPath });
}

async function showFormats() {
  const url = optState.batch ? $('otherBatch').value : $('otherUrl').value;
  if (!url.trim()) { alert('Inserisci prima un link.'); return; }
  if ($('log').style.display !== 'block') toggleLog();
  const r = await api('/ytdlp_formats', { url: url });
  if (r.formats) { $('log').textContent = r.formats; $('log').scrollTop = 0; }
}
function cancelJob() {
  const pct = Math.round(window.__pct || 0);
  if (pct > 10 && !confirm(
    'Il download è al ' + pct + '%. Vuoi davvero annullarlo?')) return;
  api('/cancel');
}
function urlValid() { return $('url').value.includes('/anime/'); }
function refreshSingleButton() {
  $('btnSingle').disabled = window.__running || !urlValid();
}
function openDest() { api('/open_folder', { path: customPath }); }
function openPath(p) { api('/open_path', { path: p }); }

async function pickFolder() {
  if (bridge.pickFolder && native) { bridge.pickFolder.postMessage(''); return; }
  const data = await api('/pick_folder');
  if (data.path) setPickedFolder(data.path);
}
function setPickedFolder(p) {
  if (!p) return;
  customPath = p;
  const parts = p.replace(/\/+$/, '').split('/');
  $('destName').textContent = parts[parts.length - 1] || p;
  $('destName').title = p;
}
function suggestUrl(u) {
  if (!$('url').value.trim()) {
    $('url').value = u.trim();
    tabCtl.select('single');
    refreshSingleButton();
  }
}
function focusUrl() {
  tabCtl.select('single');
  $('url').focus();
  $('url').select();
}

async function loadUrls() {
  const resp = await fetch('/urls');
  const data = await resp.json();
  $('batchUrls').value = data.content || '';
}
function saveUrls() { api('/save_urls', { content: $('batchUrls').value }); }

function toggleLog() {
  const open = $('log').style.display === 'block';
  $('log').style.display = open ? 'none' : 'block';
  $('disclLabel').textContent = open ? 'Mostra dettagli' : 'Nascondi dettagli';
  $('discl').classList.toggle('open', !open);
  if (!open) $('log').scrollTop = $('log').scrollHeight;
}

function fmtBytes(b) {
  if (b >= 1e9) return (b / 1e9).toFixed(2).replace('.', ',') + ' GB';
  if (b >= 1e6) return Math.round(b / 1e6) + ' MB';
  return Math.round(b / 1e3) + ' kB';
}
function fmtSpeed(bps) { return (bps / 1e6).toFixed(1).replace('.', ',') + ' MB/s'; }
function fmtEta(s) {
  if (s < 90) return 'meno di 2 minuti rimanenti';
  const m = Math.round(s / 60);
  return 'circa ' + m + ' minuti rimanenti';
}

let lastLogLength = -1;
let lastDoneCount = -1;
let lastErrorSeq = null;
async function poll() {
  try {
    const resp = await fetch('/state');
    const s = await resp.json();

    window.__running = s.running;
    $('btnBatch').disabled = s.running;
    $('btnOther').disabled = s.running;
    if (s.ytdlp) $('tabOther').classList.remove('hidden');
    refreshSingleButton();

    if (lastErrorSeq === null) {
      lastErrorSeq = s.error_seq;
    } else if (s.error_seq !== lastErrorSeq) {
      lastErrorSeq = s.error_seq;
      if (s.last_error) alert(s.last_error);
    }

    const o = s.overall;
    let extra = 0;
    for (const ep of s.episodes) extra += ep.pct / 100;
    const eff = Math.min(o.done + extra, o.total);

    $('current').classList.toggle('hidden', !s.running);
    if (s.running) {
      $('curName').textContent = o.label;
      if (o.total > 0 && eff < o.total) {
        $('curTrack').classList.remove('indet');
        window.__pct = 100 * eff / o.total;
        $('curBar').style.width = window.__pct + '%';
        $('curTrack').setAttribute('aria-valuenow', Math.round(window.__pct));
        const parts = [];
        if (o.total > 1) parts.push(Math.round(o.done) + ' di ' + o.total + ' episodi');
        if (s.bytes_now > 1e6) {
          parts.push(fmtBytes(s.bytes_now)
            + (s.bytes_total_est ? ' su ' + fmtBytes(s.bytes_total_est) : ''));
        }
        if (s.speed_bps > 1e5) parts.push(fmtSpeed(s.speed_bps));
        if (s.eta_s !== null && s.eta_s !== undefined) parts.push(fmtEta(s.eta_s));
        $('curCap').textContent = parts.length ? parts.join(' · ') : 'Avvio…';
      } else {
        $('curTrack').classList.add('indet');
        $('curCap').textContent = 'Recupero informazioni…';
      }
      const sub = $('subRows');
      sub.innerHTML = '';
      if (o.total > 1) {
        for (const ep of s.episodes) {
          const row = document.createElement('div');
          row.className = 'sub';
          row.innerHTML = '<span></span><div class="bar"><div></div></div>';
          row.querySelector('span').textContent = ep.desc;
          const bar = row.querySelector('.bar');
          bar.setAttribute('role', 'progressbar');
          bar.setAttribute('aria-label', ep.desc);
          bar.setAttribute('aria-valuemin', '0');
          bar.setAttribute('aria-valuemax', '100');
          bar.setAttribute('aria-valuenow', Math.round(ep.pct));
          bar.firstChild.style.width = ep.pct + '%';
          sub.appendChild(row);
        }
      }
    }

    if (s.completed.length !== lastDoneCount) {
      if (lastDoneCount >= 0 && s.completed.length > lastDoneCount
          && bridge.downloadDone) {
        bridge.downloadDone.postMessage(
          s.completed[s.completed.length - 1].label || '');
      }
      lastDoneCount = s.completed.length;
      const list = $('doneList');
      list.innerHTML = '';
      for (const c of [...s.completed].reverse()) {
        const row = document.createElement('div');
        row.className = 'dl';
        row.innerHTML =
          '<div class="tile" style="background:var(--tile-green); color:var(--tile-green-fg)">'
          + '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
          + '<path class="check" d="M4.5 12.5l5 5L19.5 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
          + '<div style="flex:1; min-width:0"><p class="name"></p><p class="cap"></p></div>'
          + '<button class="link">Apri nel Finder</button>';
        row.querySelector('.name').textContent = c.label;
        row.querySelector('.cap').textContent = 'Completato · ' + fmtBytes(c.size);
        row.querySelector('button').onclick = () => openPath(c.path);
        list.appendChild(row);
      }
      if (s.completed.length > 0) {
        const clear = document.createElement('button');
        clear.className = 'link';
        clear.style.marginTop = '12px';
        clear.textContent = 'Cancella elenco';
        clear.onclick = () => api('/clear_completed');
        list.appendChild(clear);
      }
    }

    $('empty').classList.toggle('hidden', s.running || s.completed.length > 0);

    if (bridge.dockProgress) {
      bridge.dockProgress.postMessage(
        s.running && o.total > 0 ? Math.round(100 * eff / o.total) : -1);
    }

    if (s.log.length !== lastLogLength) {
      lastLogLength = s.log.length;
      $('log').textContent = s.log.join('\n');
      $('log').scrollTop = $('log').scrollHeight;
    }
  } catch (e) { /* server non raggiungibile: riprova al prossimo giro */ }
}

document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const raw = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (!raw) return;
  const line = raw.split('\n').map((l) => l.trim()).find((l) => l && !l.startsWith('#'));
  if (line && line.includes('/anime/')) { $('url').value = line; tabCtl.select('single'); }
});

$('url').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !$('btnSingle').disabled) startSingle();
});
$('otherUrl').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !$('btnOther').disabled) startOther();
});
$('url').addEventListener('input', refreshSingleButton);
refreshSingleButton();
if (native) {
  $('emptySub').textContent += ', oppure premi ⌘N';
}

buildOpts();
loadUrls();
poll();
setInterval(poll, 600);
</script>
</body>
</html>
